<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3f1a"/>
      <stop offset="100%" stop-color="#3a1a08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Slingshot + web arrow -->
  <g transform="translate(800, 380)">
    <!-- Slingshot -->
    <path d="M -100 100 L 0 -100 M 0 100 L 0 -100 M 0 100 L 100 100" stroke="#f4ecd8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <line x1="-100" y1="100" x2="80" y2="-30" stroke="#c9a14a" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="80" y2="-30" stroke="#c9a14a" stroke-width="6" stroke-linecap="round"/>
    <!-- Web/arrow indicator -->
    <g transform="translate(120, -120)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#c9a14a" stroke-width="3" opacity="0.6"/>
      <path d="M -10 -10 L 10 0 L -10 10" fill="none" stroke="#c9a14a" stroke-width="3"/>
    </g>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="500" fill="#f4ecd8" text-anchor="middle" letter-spacing="-1">TIRADOR</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Phaser · Capacitor · Web + Mobile</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Phaser 3 · TypeScript · GSAP · Zustand · Capacitor</text>
</svg>
