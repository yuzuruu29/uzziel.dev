<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Document with AI spark + scan lines -->
  <g transform="translate(800, 380)">
    <!-- Document stack -->
    <rect x="-100" y="-140" width="220" height="280" fill="#1a1410" stroke="#8a7d6e" stroke-width="2" opacity="0.5" transform="rotate(-3)"/>
    <rect x="-90" y="-130" width="220" height="280" fill="#241c18" stroke="#c9a14a" stroke-width="2"/>
    <!-- Document content lines -->
    <g fill="#8a7d6e">
      <rect x="-70" y="-110" width="180" height="6" rx="1"/>
      <rect x="-70" y="-94" width="120" height="6" rx="1"/>
      <rect x="-70" y="-74" width="160" height="6" rx="1"/>
      <rect x="-70" y="-54" width="140" height="6" rx="1"/>
      <rect x="-70" y="-34" width="180" height="6" rx="1"/>
      <rect x="-70" y="-14" width="100" height="6" rx="1"/>
    </g>
    <!-- AI spark / classifier indicator -->
    <g transform="translate(100, -130)" filter="url(#aiGlow)">
      <circle cx="0" cy="0" r="36" fill="#1a1410" stroke="#c9a14a" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#c9a14a"/>
      <circle cx="0" cy="0" r="6" fill="#1a1410"/>
    </g>
    <!-- Status dots: OCR, Classification, Compilation -->
    <g transform="translate(0, 140)">
      <circle cx="-60" cy="0" r="6" fill="#c9a14a"/>
      <text x="-46" y="6" font-family="'JetBrains Mono', monospace" font-size="14" fill="#c9a14a">OCR</text>
      <circle cx="20" cy="0" r="6" fill="#c9a14a"/>
      <text x="34" y="6" font-family="'JetBrains Mono', monospace" font-size="14" fill="#c9a14a">Classify</text>
      <circle cx="116" cy="0" r="6" fill="#c9a14a"/>
      <text x="130" y="6" font-family="'JetBrains Mono', monospace" font-size="14" fill="#c9a14a">Compile</text>
    </g>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="80" font-weight="500" fill="#f4ecd8" text-anchor="middle" letter-spacing="-1">FOLIO</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Document intelligence for law offices</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Electron · React · Vite · FastAPI · Tesseract</text>
</svg>
