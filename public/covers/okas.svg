<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3010"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Ledger book + peso icon -->
  <g transform="translate(800, 380)">
    <!-- Ledger book (open) -->
    <path d="M -160 0 L 0 -80 L 160 0 L 0 80 Z" fill="#c9a14a" stroke="#f4ecd8" stroke-width="3"/>
    <!-- Pages -->
    <path d="M -140 0 L 0 -68 L 140 0 L 0 68 Z" fill="#f4ecd8" opacity="0.2"/>
    <!-- Center binding -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#1a1410" stroke-width="2"/>
    <!-- Lines on pages -->
    <g stroke="#1a1410" stroke-width="1" opacity="0.4">
      <line x1="-120" y1="-20" x2="-20" y2="-48"/>
      <line x1="-120" y1="0" x2="-20" y2="-28"/>
      <line x1="-120" y1="20" x2="-20" y2="-8"/>
      <line x1="20" y1="-48" x2="120" y2="-20"/>
      <line x1="20" y1="-28" x2="120" y2="0"/>
      <line x1="20" y1="-8" x2="120" y2="20"/>
    </g>
    <!-- Peso coin on top -->
    <circle cx="0" cy="-110" r="32" fill="#f4ecd8" stroke="#c9a14a" stroke-width="3"/>
    <text x="0" y="-100" font-family="Fraunces, Georgia, serif" font-size="32" font-weight="600" fill="#6b3410" text-anchor="middle">₱</text>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="500" fill="#f4ecd8" text-anchor="middle">Oka's Farm Bookkeeping</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">14 months of agri accounting</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Excel · QuickBooks-style ledgers</text>
</svg>
