<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5028"/>
      <stop offset="100%" stop-color="#1a2410"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Heart with rice stalks -->
  <g transform="translate(800, 380)">
    <!-- Heart -->
    <path d="M 0 100 C -140 0 -160 -90 -80 -140 C -40 -160 0 -140 0 -100 C 0 -140 40 -160 80 -140 C 160 -90 140 0 0 100 Z" fill="#4a6b3a" stroke="#f4ecd8" stroke-width="3"/>
    <!-- Rice stalks inside heart -->
    <g stroke="#f4ecd8" stroke-width="4" stroke-linecap="round">
      <line x1="-30" y1="60" x2="-30" y2="-50"/>
      <line x1="0" y1="60" x2="0" y2="-50"/>
      <line x1="30" y1="60" x2="30" y2="-50"/>
    </g>
    <g fill="#c9a14a">
      <ellipse cx="-30" cy="-50" rx="3" ry="6"/>
      <ellipse cx="0" cy="-50" rx="3" ry="6"/>
      <ellipse cx="30" cy="-50" rx="3" ry="6"/>
    </g>
    <!-- Ground -->
    <line x1="-100" y1="120" x2="100" y2="120" stroke="#c9a14a" stroke-width="3"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#f4ecd8" text-anchor="middle">Lupa at Puso</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Filipino Farming Sim RPG · Game Design Document</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">25 design docs · 4-week sprint · Godot 4.3+</text>
</svg>
