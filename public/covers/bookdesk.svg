  <text x="88" y="473" fill="#657079" font-family="Arial, Helvetica, sans-serif" font-size="34">A considered path from transaction to approval.</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#d1d7d8" font-size="24" letter-spacing="2">
