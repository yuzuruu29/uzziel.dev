  <desc id="desc">A large Bookdesk wordmark on warm paper with a navy bookkeeping grid and a brass approval mark.</desc>
  <rect width="1600" height="1000" fill="#ece9e0"/>
  <path d="M0 588H1600V1000H0Z" fill="#253647"/>
  <path d="M80 110H1520" stroke="#b8b3a4" stroke-width="2"/>
  <g stroke="#5a6c7b" stroke-width="2" fill="none">
    <path d="M80 664H1520M80 738H1520M80 812H1520M80 886H1520"/>
    <path d="M174 664V886M878 664V886M1122 664V886M1366 664V886"/>
  </g>
  <path d="M944 773h112M1188 699h112M1188 847h112" stroke="#a8b5bc" stroke-width="5"/>
