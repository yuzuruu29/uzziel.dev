<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Odysseus project cover</title>
  <desc id="desc">A night-sky chart on an ink-to-narra gradient showing a teal dotted route between Philippine-archipelago port nodes above the project title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101518"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0%" stop-color="#c9a14a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9a14a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>

  <!-- Faint monsoon rings -->
  <g stroke="#c9a14a" stroke-width="1" fill="none" opacity="0.10">
    <path d="M 1280 200 m 0 -120 a 120 120 0 1 0 0 240 a 120 120 0 1 0 0 -240"/>
    <path d="M 1280 200 m 0 -180 a 180 180 0 1 0 0 360 a 180 180 0 1 0 0 -360"/>
  </g>

  <!-- Route graph -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Route spine (teal accent) -->
    <path d="M 220 360 L 460 300 L 760 360 L 1020 250 L 1240 380 L 1380 250"
          fill="none" stroke="#3f7a82" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="2 16" opacity="0.95"/>
    <!-- Ledger-edge connectors (gold) -->
    <g stroke="#c9a14a" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
      <line x1="460" y1="300" x2="520" y2="220"/>
      <line x1="760" y1="360" x2="680" y2="470"/>
      <line x1="1020" y1="250" x2="1080" y2="430"/>
      <line x1="1240" y1="380" x2="1180" y2="470"/>
    </g>
    <!-- Port nodes (cream ring, gold core) -->
    <g>
      <g transform="translate(220, 360)">
        <circle r="11" fill="#c9a14a"/>
        <circle r="11" fill="none" stroke="#f4ecd8" stroke-width="2" opacity="0.7"/>
      </g>
      <g transform="translate(460, 300)">
        <circle r="11" fill="#c9a14a"/>
        <circle r="11" fill="none" stroke="#f4ecd8" stroke-width="2" opacity="0.7"/>
      </g>
      <g transform="translate(520, 220)">
        <circle r="8" fill="#c9a14a" opacity="0.65"/>
      </g>
      <g transform="translate(760, 360)">
        <circle r="13" fill="#c9a14a"/>
        <circle r="13" fill="none" stroke="#f4ecd8" stroke-width="2" opacity="0.7"/>
      </g>
      <g transform="translate(680, 470)">
        <circle r="8" fill="#c9a14a" opacity="0.65"/>
      </g>
      <g transform="translate(1020, 250)">
        <circle r="11" fill="#c9a14a"/>
        <circle r="11" fill="none" stroke="#f4ecd8" stroke-width="2" opacity="0.7"/>
      </g>
      <g transform="translate(1080, 430)">
        <circle r="8" fill="#c9a14a" opacity="0.65"/>
      </g>
      <g transform="translate(1240, 380)">
        <circle r="11" fill="#c9a14a"/>
        <circle r="11" fill="none" stroke="#f4ecd8" stroke-width="2" opacity="0.7"/>
      </g>
      <g transform="translate(1180, 470)">
        <circle r="8" fill="#c9a14a" opacity="0.65"/>
      </g>
      <g transform="translate(1380, 250)">
        <circle r="11" fill="#c9a14a"/>
        <circle r="11" fill="none" stroke="#f4ecd8" stroke-width="2" opacity="0.7"/>
      </g>
    </g>
    <!-- Small hull glyph on the central route -->
    <g transform="translate(880, 305) rotate(8)">
      <path d="M -22 8 L 22 8 L 16 16 L -16 16 Z" fill="#f4ecd8" opacity="0.9"/>
      <line x1="0" y1="8" x2="0" y2="-14" stroke="#f4ecd8" stroke-width="2"/>
      <path d="M 0 -14 L 14 -2 L 0 4 Z" fill="#3f7a82"/>
    </g>
  </g>

  <!-- Title block -->
  <text x="800" y="700" font-family="Fraunces, Georgia, serif" font-size="76" font-weight="500" fill="#f4ecd8" text-anchor="middle">Odysseus</text>
  <text x="800" y="752" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6">ARCHIPELAGO TRAVEL LEDGER</text>
  <text x="800" y="828" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Godot 4 · GDScript · SQLite</text>
</svg>
