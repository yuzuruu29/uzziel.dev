<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="50%" stop-color="#2a1f18"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b3410"/>
      <stop offset="100%" stop-color="#c9a14a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#accent)" opacity="0.05"/>
  <!-- Terminal / code window icon -->
  <g transform="translate(800, 360)">
    <!-- Window -->
    <rect x="-180" y="-100" width="360" height="200" rx="10" fill="#0d1117" stroke="#c9a14a" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="-180" y="-100" width="360" height="28" rx="10" fill="#21262d"/>
    <rect x="-180" y="-78" width="360" height="6" fill="#21262d"/>
    <!-- Traffic lights -->
    <circle cx="-160" cy="-86" r="5" fill="#ff5f56"/>
    <circle cx="-142" cy="-86" r="5" fill="#ffbd2e"/>
    <circle cx="-124" cy="-86" r="5" fill="#27c93f"/>
    <!-- Code lines -->
    <rect x="-160" y="-56" width="60" height="6" fill="#79c0ff" rx="1"/>
    <rect x="-100" y="-56" width="120" height="6" fill="#f4ecd8" rx="1" opacity="0.5"/>
    <rect x="-160" y="-38" width="40" height="6" fill="#a5d6ff" rx="1"/>
    <rect x="-110" y="-38" width="100" height="6" fill="#7ee787" rx="1"/>
    <rect x="-160" y="-20" width="80" height="6" fill="#ffa657" rx="1"/>
    <rect x="-70" y="-20" width="80" height="6" fill="#f4ecd8" rx="1" opacity="0.5"/>
    <rect x="-160" y="-2" width="60" height="6" fill="#79c0ff" rx="1"/>
    <rect x="-160" y="16" width="120" height="6" fill="#7ee787" rx="1"/>
    <rect x="-160" y="34" width="40" height="6" fill="#a5d6ff" rx="1"/>
    <rect x="-110" y="34" width="100" height="6" fill="#f4ecd8" rx="1" opacity="0.5"/>
    <rect x="-160" y="52" width="80" height="6" fill="#ffa657" rx="1"/>
    <rect x="-70" y="52" width="60" height="6" fill="#f4ecd8" rx="1" opacity="0.5"/>
    <!-- Cursor -->
    <rect x="-10" y="52" width="6" height="6" fill="#c9a14a"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="500" fill="#f4ecd8" text-anchor="middle" letter-spacing="-1">uzziel.dev</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">I research, build, and ship.</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Astro 4 · React · TypeScript · 27 Playwright tests</text>
</svg>
