<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2018"/>
      <stop offset="100%" stop-color="#03100c"/>
    </linearGradient>
    <filter id="gGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Shield with checkmark -->
  <g transform="translate(800, 380)">
    <!-- Shield -->
    <path d="M 0 -140 L 120 -100 L 120 20 Q 120 110 0 160 Q -120 110 -120 20 L -120 -100 Z" fill="#4a6b3a" stroke="#3fb950" stroke-width="4"/>
    <!-- Inner shield -->
    <path d="M 0 -116 L 100 -82 L 100 18 Q 100 96 0 138 Q -100 96 -100 18 L -100 -82 Z" fill="#1a3a2a" stroke="#3fb950" stroke-width="2" opacity="0.5"/>
    <!-- Checkmark -->
    <path d="M -50 10 L -10 50 L 60 -40" stroke="#3fb950" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#gGlow)"/>
  </g>
  <!-- Corner dots (scanning effect) -->
  <g stroke="#3fb950" stroke-width="3" fill="none" opacity="0.4">
    <path d="M 400 200 L 400 230 L 430 230"/>
    <path d="M 1200 200 L 1200 230 L 1170 230"/>
    <path d="M 400 560 L 400 530 L 430 530"/>
    <path d="M 1200 560 L 1200 530 L 1170 530"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="500" fill="#f4ecd8" text-anchor="middle">ApplyGuard PH</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#3fb950" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Job-post scam detector</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">React · Vite · Tailwind · Vitest</text>
</svg>
