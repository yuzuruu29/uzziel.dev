  <rect width="1600" height="1000" fill="#ede9f8"/>
  <rect x="92" y="82" width="1416" height="836" rx="38" fill="#faf8ff" stroke="#6d4aff" stroke-width="3"/>
  <rect x="865" y="180" width="480" height="220" rx="28" fill="#6d4aff"/>
