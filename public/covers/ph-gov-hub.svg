<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2c5c"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Sun rays (from PH flag) -->
  <g transform="translate(800, 200)" fill="#c9a14a" opacity="0.15">
    <polygon points="0,-50 6,-20 36,-20 12,0 22,30 0,12 -22,30 -12,0 -36,-20 -6,-20"/>
  </g>
  <!-- Government building / capitol columns -->
  <g transform="translate(800, 400)">
    <!-- Pediment triangle -->
    <polygon points="0,-200 -180,-100 180,-100" fill="#c9a14a" stroke="#f4ecd8" stroke-width="3"/>
    <!-- Architrave -->
    <rect x="-200" y="-100" width="400" height="30" fill="#c9a14a" stroke="#f4ecd8" stroke-width="2"/>
    <!-- Columns -->
    <g fill="#c9a14a" stroke="#f4ecd8" stroke-width="2">
      <rect x="-180" y="-70" width="30" height="180"/>
      <rect x="-90" y="-70" width="30" height="180"/>
      <rect x="0" y="-70" width="30" height="180"/>
      <rect x="90" y="-70" width="30" height="180"/>
      <rect x="150" y="-70" width="30" height="180"/>
    </g>
    <!-- Column capitals -->
    <g fill="#c9a14a" stroke="#f4ecd8" stroke-width="1">
      <rect x="-185" y="-78" width="40" height="8"/>
      <rect x="-95" y="-78" width="40" height="8"/>
      <rect x="-5" y="-78" width="40" height="8"/>
      <rect x="85" y="-78" width="40" height="8"/>
      <rect x="145" y="-78" width="40" height="8"/>
    </g>
    <!-- Base / steps -->
    <rect x="-210" y="110" width="420" height="20" fill="#c9a14a" stroke="#f4ecd8" stroke-width="2"/>
    <rect x="-230" y="130" width="460" height="15" fill="#c9a14a" stroke="#f4ecd8" stroke-width="1" opacity="0.7"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="500" fill="#f4ecd8" text-anchor="middle">PH Gov Hub</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">40+ Philippine government services</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Next.js 14 · TypeScript · Tailwind · Fuse.js</text>
</svg>
