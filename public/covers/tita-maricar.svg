<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3010"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Wok + steam icon -->
  <g transform="translate(800, 380)">
    <!-- Steam wisps -->
    <g stroke="#f4ecd8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6">
      <path d="M -40 -150 Q -50 -170 -40 -190 Q -30 -210 -40 -230"/>
      <path d="M 0 -150 Q -10 -170 0 -190 Q 10 -210 0 -230"/>
      <path d="M 40 -150 Q 30 -170 40 -190 Q 50 -210 40 -230"/>
    </g>
    <!-- Wok (circle with handles) -->
    <ellipse cx="0" cy="0" rx="130" ry="40" fill="#1a1410" stroke="#c9a14a" stroke-width="6"/>
    <ellipse cx="0" cy="-10" rx="100" ry="20" fill="#3a1a08" stroke="#c9a14a" stroke-width="3"/>
    <!-- Wok handles -->
    <rect x="-150" y="-10" width="20" height="20" rx="3" fill="#c9a14a"/>
    <rect x="130" y="-10" width="20" height="20" rx="3" fill="#c9a14a"/>
    <!-- Noodles inside -->
    <g stroke="#c9a14a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M -80 -10 Q -50 -30 -20 -10 T 60 -10"/>
      <path d="M -70 0 Q -30 -20 10 0 T 80 0"/>
      <path d="M -60 10 Q -20 -10 20 10 T 70 10"/>
    </g>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="500" fill="#f4ecd8" text-anchor="middle">Tita Maricar's</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Panciteria & Lutong Ulam · Calo, Bay, Laguna</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">static site · daily social marketing · content ops</text>
</svg>
