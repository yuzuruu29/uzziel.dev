<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a3f1a"/>
      <stop offset="100%" stop-color="#3a1a08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Chat bubbles -->
  <g transform="translate(800, 380)">
    <!-- Bot bubble -->
    <path d="M -180 -80 L 60 -80 Q 80 -80 80 -60 L 80 30 Q 80 50 60 50 L -40 50 L -70 80 L -60 50 L -180 50 Q -200 50 -200 30 L -200 -60 Q -200 -80 -180 -80 Z" fill="#c9a14a" stroke="#f4ecd8" stroke-width="2"/>
    <!-- Bot dots -->
    <circle cx="-150" cy="-15" r="8" fill="#1a1410"/>
    <circle cx="-110" cy="-15" r="8" fill="#1a1410"/>
    <circle cx="-70" cy="-15" r="8" fill="#1a1410"/>
    <!-- User bubble (smaller, opposite side) -->
    <path d="M 100 -10 L 200 -10 Q 220 -10 220 10 L 220 60 Q 220 80 200 80 L 180 80 L 200 110 L 160 80 L 100 80 Q 80 80 80 60 L 80 10 Q 80 -10 100 -10 Z" fill="#f4ecd8" stroke="#c9a14a" stroke-width="2"/>
    <line x1="100" y1="20" x2="200" y2="20" stroke="#1a1410" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="40" x2="190" y2="40" stroke="#1a1410" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="60" x2="170" y2="60" stroke="#1a1410" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- AI dots float -->
  <g fill="#c9a14a" opacity="0.5">
    <circle cx="300" cy="240" r="4"/>
    <circle cx="1280" cy="280" r="6"/>
    <circle cx="1300" cy="500" r="4"/>
    <circle cx="280" cy="480" r="5"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="500" fill="#f4ecd8" text-anchor="middle">AI Micro-Agency</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Botpress chatbots for PH SMEs</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Botpress · Claude · ChatGPT</text>
</svg>
