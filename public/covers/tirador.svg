<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3f1a"/>
      <stop offset="100%" stop-color="#3a1a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c9a14a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c9a14a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- Slingshot icon -->
  <g transform="translate(800, 380)">
    <!-- Y-shaped frame -->
    <path d="M -120 120 L 0 -120 M 0 120 L 0 -120 M 0 120 L 120 120" stroke="#f4ecd8" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Elastic band -->
    <line x1="-120" y1="120" x2="100" y2="-40" stroke="#c9a14a" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="100" y2="-40" stroke="#c9a14a" stroke-width="8" stroke-linecap="round"/>
    <!-- Stone projectile -->
    <circle cx="100" cy="-40" r="14" fill="#c9a14a"/>
    <!-- Pouch -->
    <ellipse cx="100" cy="-40" rx="22" ry="8" fill="#f4ecd8" opacity="0.4"/>
  </g>
  <!-- Crosshair target -->
  <g transform="translate(1280, 240)" stroke="#c9a14a" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="0" cy="0" r="60"/>
    <line x1="-80" y1="0" x2="-30" y2="0"/>
    <line x1="30" y1="0" x2="80" y2="0"/>
    <line x1="0" y1="-80" x2="0" y2="-30"/>
    <line x1="0" y1="30" x2="0" y2="80"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="500" fill="#f4ecd8" text-anchor="middle" letter-spacing="-1">TIRADOR</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Barangay Survivors</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Godot 4 · GDScript · Aseprite</text>
</svg>
