<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Three storefronts -->
  <g transform="translate(800, 360)">
    <!-- Store 1: Food (awning) -->
    <g transform="translate(-260, 0)">
      <!-- Building -->
      <rect x="-60" y="-40" width="120" height="120" fill="#1a1410" stroke="#c9a14a" stroke-width="2"/>
      <!-- Awning -->
      <path d="M -70 -40 L 70 -40 L 60 -20 L -60 -20 Z" fill="#c9a14a" stroke="#f4ecd8" stroke-width="1"/>
      <!-- Window -->
      <rect x="-40" y="0" width="80" height="60" fill="#c9a14a" opacity="0.3" stroke="#c9a14a" stroke-width="2"/>
      <!-- Fork & spoon icon -->
      <g stroke="#c9a14a" stroke-width="3" fill="#c9a14a">
        <line x1="-15" y1="10" x2="-15" y2="55" stroke-width="4"/>
        <line x1="15" y1="10" x2="15" y2="55" stroke-width="4"/>
        <circle cx="0" cy="15" r="3" fill="#c9a14a"/>
      </g>
    </g>
    <!-- Store 2: Resort (palm tree) -->
    <g transform="translate(0, 0)">
      <rect x="-60" y="-40" width="120" height="120" fill="#1a1410" stroke="#4a6b3a" stroke-width="2"/>
      <!-- Roof -->
      <path d="M -60 -40 L 0 -60 L 60 -40 Z" fill="#4a6b3a" stroke="#f4ecd8" stroke-width="1"/>
      <rect x="-40" y="0" width="80" height="60" fill="#4a6b3a" opacity="0.3" stroke="#4a6b3a" stroke-width="2"/>
      <!-- Palm -->
      <line x1="0" y1="50" x2="0" y2="20" stroke="#4a6b3a" stroke-width="3"/>
      <path d="M -20 20 Q 0 10 20 20 M -15 25 Q 0 15 15 25 M -10 30 Q 0 22 10 30" stroke="#4a6b3a" stroke-width="2" fill="none"/>
    </g>
    <!-- Store 3: Church (cross) -->
    <g transform="translate(260, 0)">
      <rect x="-60" y="-40" width="120" height="120" fill="#1a1410" stroke="#c9a14a" stroke-width="2"/>
      <!-- Steeple -->
      <polygon points="0,-70 -30,-40 30,-40" fill="#c9a14a" stroke="#f4ecd8" stroke-width="1"/>
      <rect x="-30" y="-40" width="60" height="20" fill="#c9a14a" opacity="0.5"/>
      <rect x="-40" y="-20" width="80" height="100" fill="#c9a14a" opacity="0.3" stroke="#c9a14a" stroke-width="2"/>
      <!-- Cross -->
      <rect x="-3" y="-50" width="6" height="40" fill="#c9a14a"/>
      <rect x="-10" y="-40" width="20" height="6" fill="#c9a14a"/>
    </g>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="500" fill="#f4ecd8" text-anchor="middle">Starter Business Websites</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Food · Resort · Church templates</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Vite · React · Tailwind · Netlify</text>
</svg>
