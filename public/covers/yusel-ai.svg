<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a14a"/>
      <stop offset="100%" stop-color="#8a6a2a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- AI sparkle / orbit icon -->
  <g transform="translate(800, 380)">
    <!-- Central sphere -->
    <circle cx="0" cy="0" r="50" fill="#1a1410" stroke="#f4ecd8" stroke-width="4"/>
    <circle cx="0" cy="0" r="20" fill="#f4ecd8" opacity="0.3"/>
    <!-- Orbital paths -->
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#1a1410" stroke-width="2" opacity="0.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#1a1410" stroke-width="2" opacity="0.4" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#1a1410" stroke-width="2" opacity="0.3" transform="rotate(90)"/>
    <!-- Orbiting nodes -->
    <circle cx="156" cy="30" r="10" fill="#1a1410" transform="rotate(30)"/>
    <circle cx="-156" cy="30" r="10" fill="#1a1410" transform="rotate(-30)"/>
    <circle cx="0" cy="180" r="10" fill="#1a1410"/>
    <!-- Sparkles -->
    <g fill="#f4ecd8" filter="url(#glow)">
      <circle cx="-200" cy="-120" r="4"/>
      <circle cx="180" cy="-100" r="3"/>
      <circle cx="220" cy="80" r="5"/>
      <circle cx="-220" cy="100" r="3"/>
    </g>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#1a1410" text-anchor="middle" letter-spacing="-1">YUSEL AI</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#1a1410" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Free-first AI for Filipino sellers</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1a1410" text-anchor="middle" opacity="0.7">Next.js · Supabase · Groq · shadcn/ui</text>
</svg>
