    <circle cx="0" cy="0" r="36" fill="#c9a14a"/>
    <line x1="0" y1="-42" x2="0" y2="-34" stroke="#c9a14a" stroke-width="2"/>
    <line x1="49" y1="14" x2="42" y2="10" stroke="#c9a14a" stroke-width="2"/>
    <line x1="-49" y1="14" x2="-42" y2="10" stroke="#c9a14a" stroke-width="2"/>
