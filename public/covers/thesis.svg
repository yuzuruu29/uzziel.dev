<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3010"/>
      <stop offset="100%" stop-color="#3a1a08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Rice field rows + chart icon -->
  <g transform="translate(800, 380)">
    <!-- Field rows -->
    <line x1="-220" y1="80" x2="220" y2="80" stroke="#c9a14a" stroke-width="3" opacity="0.4"/>
    <line x1="-220" y1="50" x2="220" y2="50" stroke="#c9a14a" stroke-width="3" opacity="0.5"/>
    <line x1="-220" y1="20" x2="220" y2="20" stroke="#c9a14a" stroke-width="3" opacity="0.6"/>
    <!-- Rice stalks -->
    <g stroke="#c9a14a" stroke-width="3" fill="#c9a14a" opacity="0.7">
      <line x1="-160" y1="80" x2="-160" y2="20"/>
      <line x1="-80" y1="80" x2="-80" y2="20"/>
      <line x1="0" y1="80" x2="0" y2="20"/>
      <line x1="80" y1="80" x2="80" y2="20"/>
      <line x1="160" y1="80" x2="160" y2="20"/>
    </g>
    <!-- Bar chart below stalks -->
    <g fill="#f4ecd8" opacity="0.85">
      <rect x="-150" y="-30" width="40" height="50"/>
      <rect x="-90" y="-60" width="40" height="80"/>
      <rect x="-30" y="-10" width="40" height="30"/>
      <rect x="30" y="-80" width="40" height="100"/>
      <rect x="90" y="-50" width="40" height="70"/>
    </g>
    <!-- Chart axis -->
    <line x1="-170" y1="20" x2="170" y2="20" stroke="#f4ecd8" stroke-width="2" opacity="0.6"/>
    <line x1="-170" y1="-90" x2="-170" y2="20" stroke="#f4ecd8" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="500" fill="#f4ecd8" text-anchor="middle">Land Conversion × Rice</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">AAE 195 Thesis · Bay, Laguna</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">QGIS · R · APA 7</text>
</svg>
