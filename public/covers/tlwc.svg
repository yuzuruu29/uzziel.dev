<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3010"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#c9a14a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a14a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#light)"/>
  <!-- Church window arch with cross -->
  <g transform="translate(800, 380)">
    <!-- Arch -->
    <path d="M -120 120 L -120 -40 Q -120 -120 0 -120 Q 120 -120 120 -40 L 120 120 Z" fill="#1a1410" stroke="#c9a14a" stroke-width="6"/>
    <!-- Inner window -->
    <path d="M -90 90 L -90 -30 Q -90 -90 0 -90 Q 90 -90 90 -30 L 90 90 Z" fill="#c9a14a" opacity="0.15"/>
    <!-- Cross -->
    <rect x="-10" y="-80" width="20" height="160" fill="#c9a14a"/>
    <rect x="-60" y="-30" width="120" height="20" fill="#c9a14a"/>
    <!-- Halo -->
    <circle cx="0" cy="-30" r="50" fill="none" stroke="#c9a14a" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="500" fill="#f4ecd8" text-anchor="middle">The Lord's Worship Center</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">TLWC · Bay, Laguna</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">HTML · CSS · JavaScript · Netlify</text>
</svg>
