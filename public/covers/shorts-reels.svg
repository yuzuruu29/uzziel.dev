<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Film strip / video reel -->
  <g transform="translate(800, 380)">
    <!-- Film strip outer -->
    <rect x="-280" y="-100" width="560" height="200" rx="8" fill="#1a1410" stroke="#c9a14a" stroke-width="3"/>
    <!-- Perforation holes top -->
    <g fill="#0d0a08">
      <rect x="-260" y="-90" width="20" height="14" rx="2"/>
      <rect x="-220" y="-90" width="20" height="14" rx="2"/>
      <rect x="-180" y="-90" width="20" height="14" rx="2"/>
      <rect x="-140" y="-90" width="20" height="14" rx="2"/>
      <rect x="-100" y="-90" width="20" height="14" rx="2"/>
      <rect x="-60" y="-90" width="20" height="14" rx="2"/>
      <rect x="-20" y="-90" width="20" height="14" rx="2"/>
      <rect x="20" y="-90" width="20" height="14" rx="2"/>
      <rect x="60" y="-90" width="20" height="14" rx="2"/>
      <rect x="100" y="-90" width="20" height="14" rx="2"/>
      <rect x="140" y="-90" width="20" height="14" rx="2"/>
      <rect x="180" y="-90" width="20" height="14" rx="2"/>
      <rect x="220" y="-90" width="20" height="14" rx="2"/>
    </g>
    <!-- Perforation holes bottom -->
    <g fill="#0d0a08">
      <rect x="-260" y="76" width="20" height="14" rx="2"/>
      <rect x="-220" y="76" width="20" height="14" rx="2"/>
      <rect x="-180" y="76" width="20" height="14" rx="2"/>
      <rect x="-140" y="76" width="20" height="14" rx="2"/>
      <rect x="-100" y="76" width="20" height="14" rx="2"/>
      <rect x="-60" y="76" width="20" height="14" rx="2"/>
      <rect x="-20" y="76" width="20" height="14" rx="2"/>
      <rect x="20" y="76" width="20" height="14" rx="2"/>
      <rect x="60" y="76" width="20" height="14" rx="2"/>
      <rect x="100" y="76" width="20" height="14" rx="2"/>
      <rect x="140" y="76" width="20" height="14" rx="2"/>
      <rect x="180" y="76" width="20" height="14" rx="2"/>
      <rect x="220" y="76" width="20" height="14" rx="2"/>
    </g>
    <!-- Play button -->
    <circle cx="0" cy="0" r="60" fill="#c9a14a" stroke="#f4ecd8" stroke-width="3"/>
    <polygon points="-20,-30 -20,30 30,0" fill="#1a1410"/>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="500" fill="#f4ecd8" text-anchor="middle">Shorts + Reels Pipeline</text>
  <text x="800" y="685" font-family="'Inter Tight', sans-serif" font-size="18" fill="#c9a14a" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Long-form → vertical clips with burned-in subs</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a7d6e" text-anchor="middle">Python · ffmpeg · Whisper · SRT</text>
</svg>
