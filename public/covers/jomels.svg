<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#d4c4a0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Fried chicken drumstick icon -->
  <g transform="translate(800, 380)">
    <!-- Drumstick handle (bone) -->
    <rect x="-50" y="80" width="100" height="30" rx="15" fill="#f4ecd8" stroke="#1a1410" stroke-width="4" transform="rotate(-20 0 95)"/>
    <!-- Chicken piece -->
    <g transform="rotate(-20)">
      <ellipse cx="0" cy="-30" rx="120" ry="80" fill="#c9a14a" stroke="#6b3410" stroke-width="6"/>
      <ellipse cx="-20" cy="-50" rx="50" ry="30" fill="#f4ecd8" opacity="0.3"/>
      <!-- Crispy texture bumps -->
      <circle cx="-60" cy="-40" r="14" fill="#8a6a2a"/>
      <circle cx="-30" cy="-20" r="18" fill="#8a6a2a"/>
      <circle cx="20" cy="-50" r="16" fill="#8a6a2a"/>
      <circle cx="50" cy="-10" r="14" fill="#8a6a2a"/>
      <circle cx="60" cy="20" r="12" fill="#8a6a2a"/>
      <circle cx="-50" cy="20" r="10" fill="#8a6a2a"/>
    </g>
  </g>
  <!-- Title -->
  <text x="800" y="640" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="500" fill="#1a1410" text-anchor="middle">JoMel's</text>
  <text x="800" y="685" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="400" fill="#1a1410" text-anchor="middle">Fried Chicken</text>
  <text x="800" y="720" font-family="'Inter Tight', sans-serif" font-size="18" fill="#6b3410" text-anchor="middle" letter-spacing="6" text-transform="uppercase">Crispy. Juicy. Unforgettable.</text>
  <text x="800" y="760" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1a1410" text-anchor="middle" opacity="0.6">brand kit · static site · SEO</text>
</svg>
